<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let x=10
        let y=5
        let increment=x++
        document.write("indrement=",increment,"<br>")
        //10
        
        let incrementt=x++
        document.write("indrement=",incrementt,"<br>")
        //11

        let decrement=--y
        document.write("decrement=",decrement,"<br>")
        //output 4
    </script>
