<!DOCTYPE html>
<html>
<body>

<h2>Cookie Example</h2>

<button onclick="setCookie()">Set Cookie</button>
<button onclick="getCookie()">Get Cookie</button>

<p id="result"></p>

<script>
function setCookie() {
    document.cookie = "username=Rahul";
    alert("Cookie Created");
}

function getCookie() {
    document.getElementById("result").innerHTML =
    document.cookie;
}
</script>

</body>
</html>
